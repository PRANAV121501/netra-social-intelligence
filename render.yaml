services:
  - type: web
    name: netra-social-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: NETRA_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
